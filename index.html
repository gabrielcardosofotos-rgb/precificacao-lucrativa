<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E3D">
<title>Precificação Lucrativa</title>
<link rel="apple-touch-icon" id="apple-icon">
<link rel="icon" id="favicon">
<link rel="manifest" id="manifest-link">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF7F0;
    --surface:#FFFFFF;
    --ink:#1B2A22;
    --ink-soft:#5B6B62;
    --line:#E4DFD2;
    --primary:#1F4E3D;
    --primary-light:#2E7D5B;
    --gold:#B8891F;
    --gold-soft:#F2E4C1;
    --danger:#B23A2E;
    --danger-soft:#F6DEDA;
    --success:#2F7D52;
    --success-soft:#DCEEE1;
    --radius:14px;
    --shadow:0 1px 2px rgba(27,42,34,.06), 0 6px 20px rgba(27,42,34,.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    overflow:hidden;
  }
  .num{font-family:'IBM Plex Mono',monospace;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}

  #app{
    display:flex; flex-direction:column;
    height:100dvh; max-width:560px; margin:0 auto;
    background:var(--bg); position:relative;
  }

  /* ---------- Top bar ---------- */
  header.topbar{
    padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 16px;
    background:var(--primary);
    color:#fff;
    flex-shrink:0;
    position:relative;
  }
  header.topbar .brand{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    opacity:.72; margin:0 0 2px;
  }
  header.topbar h1{
    margin:0; font-size:24px; font-weight:600; line-height:1.15;
  }
  header.topbar .sub{
    margin-top:6px; font-size:13px; opacity:.8; max-width:90%;
  }
  .settings-btn{
    position:absolute; top:calc(env(safe-area-inset-top,0px) + 16px); right:16px;
    width:34px; height:34px; border-radius:50%; border:1.5px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .settings-btn svg{width:17px; height:17px; stroke:#fff; fill:none; stroke-width:1.8;}

  /* ---------- Content ---------- */
  main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:18px 16px 100px;}
  main::-webkit-scrollbar{display:none;}

  .card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow);
    padding:16px; margin-bottom:12px;
  }
  .section-title{
    font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-soft); margin:22px 2px 10px; font-weight:600;
  }
  .section-title:first-child{margin-top:2px;}

  /* KPI grid */
  .kpi-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .kpi{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; box-shadow:var(--shadow);
  }
  .kpi .label{font-size:11.5px; color:var(--ink-soft); margin-bottom:6px; line-height:1.3; min-height:28px;}
  .kpi .value{font-family:'Fraunces',serif; font-size:22px; font-weight:600; color:var(--primary);}
  .kpi .value.small{font-size:18px;}

  /* Top lists */
  .rank-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
  .rank-row:last-child{border-bottom:none;}
  .rank-idx{
    width:20px; height:20px; border-radius:50%; background:var(--gold-soft); color:var(--gold);
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .rank-name{flex:1; font-size:13.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rank-bar-wrap{flex:1; background:var(--bg); border-radius:6px; height:6px; overflow:hidden; margin:0 4px;}
  .rank-bar{height:100%; border-radius:6px;}
  .rank-val{font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600; flex-shrink:0;}

  /* Item cards (insumos, custos, produtos) */
  .item{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:13px 14px; margin-bottom:9px; box-shadow:var(--shadow);
  }
  .item .info{flex:1; min-width:0;}
  .item .info .name{font-size:14.5px; font-weight:600; margin-bottom:2px;}
  .item .info .meta{font-size:12px; color:var(--ink-soft);}
  .item .price{font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; color:var(--primary); white-space:nowrap;}
  .item .icon-btn{flex-shrink:0;}

  .empty{
    text-align:center; padding:40px 20px; color:var(--ink-soft);
  }
  .empty .display{font-size:19px; color:var(--ink); margin-bottom:6px;}
  .empty p{font-size:13px; margin:0;}

  .reorder-col{display:flex; flex-direction:column; gap:2px; flex-shrink:0;}
  .reorder-btn{
    width:22px; height:19px; border-radius:5px; border:1px solid var(--line);
    background:#fff; color:var(--ink-soft); font-size:9px; cursor:pointer; display:flex;
    align-items:center; justify-content:center; padding:0; line-height:1;
  }
  .reorder-btn:disabled{opacity:.25; cursor:default;}
  .cat-heading{
    font-size:12.5px; font-weight:700; color:var(--primary); margin:18px 2px 8px;
    padding-bottom:5px; border-bottom:2px solid var(--gold-soft);
  }
  .cat-manage-btn{
    background:var(--surface); border:1px solid var(--line); border-radius:20px;
    padding:6px 12px; font-size:12px; font-weight:600; color:var(--primary); cursor:pointer;
  }
  .cat-row{
    display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line);
  }
  .cat-row:last-child{border-bottom:none;}
  .cat-row .cat-name{flex:1; font-size:14px; font-weight:600; min-width:0;}
  .cat-row .reorder-col{flex-direction:row;}
  .cat-row .reorder-btn{width:26px; height:24px; font-size:10px;}

  /* Stamp badge (signature element) */
  .stamp{
    display:inline-flex; align-items:center; justify-content:center;
    border:2px dashed currentColor; border-radius:10px;
    padding:6px 14px; font-family:'IBM Plex Mono',monospace;
    font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
    transform:rotate(-3deg);
  }
  .stamp.ok{color:var(--success); background:var(--success-soft);}
  .stamp.bad{color:var(--danger); background:var(--danger-soft);}

  .row-between{display:flex; align-items:center; justify-content:space-between;}

  /* ---------- Bottom nav ---------- */
  nav.tabbar{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; background:var(--surface);
    border-top:1px solid var(--line);
    padding:8px 4px calc(env(safe-area-inset-bottom,0px) + 8px);
    box-shadow:0 -4px 16px rgba(27,42,34,.05);
  }
  nav.tabbar button{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; padding:6px 2px; color:var(--ink-soft);
    font-family:'Inter',sans-serif; font-size:10.5px; font-weight:500;
    cursor:pointer;
  }
  nav.tabbar button svg{width:21px; height:21px; stroke:var(--ink-soft); fill:none; stroke-width:1.8;}
  nav.tabbar button.active{color:var(--primary);}
  nav.tabbar button.active svg{stroke:var(--primary);}

  /* FAB */
  .fab{
    position:absolute; right:18px; bottom:calc(env(safe-area-inset-bottom,0px) + 84px);
    width:52px; height:52px; border-radius:50%;
    background:var(--gold); color:#fff; border:none;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(184,137,31,.45);
    font-size:26px; cursor:pointer; z-index:5;
  }

  /* ---------- Modal / sheet ---------- */
  .sheet-backdrop{
    position:absolute; inset:0; background:rgba(27,42,34,.42);
    display:none; align-items:flex-end; z-index:20;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    background:var(--bg); width:100%; max-height:88%;
    border-radius:20px 20px 0 0; padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px);
    overflow-y:auto; box-shadow:0 -8px 30px rgba(0,0,0,.2);
  }
  .sheet h2{margin:0 0 4px; font-size:19px;}
  .sheet .sheet-sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:16px;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; text-transform:uppercase; letter-spacing:.05em;}
  .field input, .field select{
    width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:10px;
    font-size:15px; font-family:'Inter',sans-serif; background:#fff; color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--primary);}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}

  .ing-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .ing-row select{flex:2;}
  .ing-row input{flex:1;}
  .ing-remove{
    flex-shrink:0; width:34px; height:34px; border-radius:9px; border:1.5px solid var(--line);
    background:#fff; color:var(--danger); font-size:16px; cursor:pointer;
  }
  .add-ing-btn{
    width:100%; padding:10px; border-radius:10px; border:1.5px dashed var(--line);
    background:transparent; color:var(--primary); font-weight:600; font-size:13px; cursor:pointer; margin-bottom:14px;
  }

  .live-summary{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin:14px 0; font-size:13px;
  }
  .live-summary .lrow{display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dashed var(--line);}
  .live-summary .lrow:last-child{border-bottom:none;}
  .live-summary .lrow.total span:last-child{font-weight:700; color:var(--primary); font-family:'IBM Plex Mono',monospace;}
  .live-summary .lrow span:last-child{font-family:'IBM Plex Mono',monospace; font-weight:600;}

  .btn-row{display:flex; gap:10px; margin-top:6px;}
  .btn{
    flex:1; padding:13px; border-radius:11px; border:none; font-size:14.5px; font-weight:600;
    cursor:pointer; font-family:'Inter',sans-serif;
  }
  .btn.primary{background:var(--primary); color:#fff;}
  .btn.ghost{background:transparent; color:var(--ink-soft); border:1.5px solid var(--line);}
  .btn.danger-ghost{background:var(--danger-soft); color:var(--danger);}

  .helper-note{font-size:11.5px; color:var(--ink-soft); line-height:1.5; margin:4px 2px 16px;}
  .install-banner{
    background:var(--gold-soft); color:#6b4f0f; border-radius:12px; padding:12px 14px;
    font-size:12.5px; margin-bottom:14px; display:flex; align-items:center; gap:10px; line-height:1.4;
  }
  .install-banner button{
    background:var(--gold); color:#fff; border:none; border-radius:8px; padding:8px 12px;
    font-size:12px; font-weight:600; flex-shrink:0; cursor:pointer;
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="settings-btn" id="btn-settings" aria-label="Configurações e backup">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.6 1Z"/></svg>
    </button>
    <p class="brand">Precificação Lucrativa</p>
    <h1 id="screen-title">Dashboard</h1>
    <p class="sub" id="screen-sub">Sua margem, sob controle.</p>
  </header>
  <main id="main"></main>

  <button class="fab" id="fab" style="display:none">+</button>

  <nav class="tabbar">
    <button data-tab="dashboard" class="active">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Painel
    </button>
    <button data-tab="custos">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9M9.5 9.5h3.7a1.8 1.8 0 0 1 0 3.6H9.8a1.8 1.8 0 0 0 0 3.6h4.2"/></svg>
      Custos
    </button>
    <button data-tab="insumos">
      <svg viewBox="0 0 24 24"><path d="M12 21c-4-2-7-6-7-10a7 7 0 0 1 14 0c0 4-3 8-7 10Z"/><path d="M12 12v9"/></svg>
      Insumos
    </button>
    <button data-tab="producao">
      <svg viewBox="0 0 24 24"><path d="M4 12c0-3 2-5 4-5 1 0 1.5 1 2.5 1s1-1.5 2-1.5S14.5 8 15.5 8c2 0 4.5 1.5 4.5 4H4Z"/><path d="M5 12l1 8h12l1-8"/></svg>
      Produção
    </button>
    <button data-tab="revenda">
      <svg viewBox="0 0 24 24"><path d="M20.5 12.7 12.7 20.5a2 2 0 0 1-2.8 0l-6.4-6.4a2 2 0 0 1 0-2.8L11.3 3.5H18a2.5 2.5 0 0 1 2.5 2.5v6.7Z"/><circle cx="15.5" cy="8.5" r="1.3"/></svg>
      Revenda
    </button>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop">
    <div class="sheet" id="sheet-content"></div>
  </div>
</div>

<script>
/* =========================================================================
   PRECIFICAÇÃO LUCRATIVA — app de controle de custos e preços
   Armazenamento 100% local (localStorage) — os dados ficam só neste aparelho.
   ========================================================================= */

const STORAGE_KEY = 'precificacao-lucrativa-v1';

const uid = () => Math.random().toString(36).slice(2, 10);

const DEFAULT_STATE = {
  producaoMensal: 3000,
  custosFixos: [
    { id: uid(), desc: 'Aluguel', valor: 1800 },
    { id: uid(), desc: 'Energia elétrica', valor: 420 },
    { id: uid(), desc: 'Internet', valor: 120 },
    { id: uid(), desc: 'Salários e encargos', valor: 3200 },
  ],
  taxas: [
    { id: uid(), desc: 'Simples Nacional', pct: 0.06 },
    { id: uid(), desc: 'Taxa de cartão/maquininha', pct: 0.025 },
    { id: uid(), desc: 'iFood / Marketplaces', pct: 0.12 },
  ],
  insumos: [
    { id: uid(), nome: 'Farinha de trigo', unidade: 'kg', qtdEmbalagem: 1, precoCompra: 5.2 },
    { id: uid(), nome: 'Manteiga', unidade: 'kg', qtdEmbalagem: 1, precoCompra: 34 },
    { id: uid(), nome: 'Açúcar refinado', unidade: 'kg', qtdEmbalagem: 1, precoCompra: 4.6 },
    { id: uid(), nome: 'Ovos', unidade: 'unidade', qtdEmbalagem: 1, precoCompra: 0.8 },
    { id: uid(), nome: 'Chocolate em gotas', unidade: 'kg', qtdEmbalagem: 1, precoCompra: 46 },
  ],
  fabricacao: [],
  revenda: [],
  categoriasProducao: [],
};

let state = loadState();
let activeTab = 'dashboard';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return structuredClone(DEFAULT_STATE);
    const parsed = JSON.parse(raw);
    return { ...structuredClone(DEFAULT_STATE), ...parsed };
  } catch (e) {
    return structuredClone(DEFAULT_STATE);
  }
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* ---------------- cálculos ---------------- */
function totalFixo() { return state.custosFixos.reduce((s, c) => s + Number(c.valor || 0), 0); }
function rateio() { const p = Number(state.producaoMensal || 0); return p > 0 ? totalFixo() / p : 0; }
function totalTaxas() { return state.taxas.reduce((s, t) => s + Number(t.pct || 0), 0); }
function insumoById(id) { return state.insumos.find(i => i.id === id); }
function custoUnitInsumo(insumo) {
  if (!insumo) return 0;
  const q = Number(insumo.qtdEmbalagem || 0);
  return q > 0 ? Number(insumo.precoCompra || 0) / q : 0;
}

function calcFabricacao(prod) {
  const subtotalReceita = prod.ingredientes.reduce((s, ing) => {
    const ins = insumoById(ing.insumoId);
    return s + custoUnitInsumo(ins) * Number(ing.qtd || 0);
  }, 0);
  const rendimento = Math.max(1, Number(prod.rendimento || 1));
  const custoBase = subtotalReceita / rendimento; // custo de insumos da receita, por unidade
  const custoAdicionais = (prod.adicionais || []).reduce((s, ad) => {
    const ins = insumoById(ad.insumoId);
    return s + custoUnitInsumo(ins) * Number(ad.qtd || 0);
  }, 0); // já é por unidade, não divide pelo rendimento
  const subtotal = custoBase + custoAdicionais;
  const rt = rateio();
  const custoTotal = subtotal + rt;
  const tax = totalTaxas();
  const denom = 1 - Number(prod.margem || 0) - tax;
  const precoIdeal = denom > 0 ? custoTotal / denom : 0;
  const atual = Number(prod.precoAtual || 0);
  const resultado = atual - custoTotal; // resultado (atual vs. custo total de produção)
  const lucroUnit = atual - custoTotal - atual * tax;
  const custoVariavel = subtotal;
  const margemContrib = atual - custoVariavel - atual * tax;
  return { subtotalReceita, rendimento, custoBase, custoAdicionais, subtotal, rateio: rt, custoTotal, precoIdeal, resultado, lucroUnit, margemContrib,
           status: atual >= precoIdeal ? 'ok' : 'bad' };
}
function calcRevenda(prod) {
  const rt = rateio();
  const custoTotal = Number(prod.custoCompra || 0) + rt;
  const tax = totalTaxas();
  const denom = 1 - Number(prod.margem || 0) - tax;
  const precoIdeal = denom > 0 ? custoTotal / denom : 0;
  const atual = Number(prod.precoAtual || 0);
  const resultado = atual - precoIdeal;
  const lucroUnit = atual - custoTotal - atual * tax;
  const margemContrib = atual - Number(prod.custoCompra || 0) - atual * tax;
  return { custoTotal, precoIdeal, resultado, lucroUnit, margemContrib,
           status: atual >= precoIdeal ? 'ok' : 'bad' };
}

function allProducts() {
  const fab = state.fabricacao.map(p => ({ ...p, tipo: 'fab', calc: calcFabricacao(p) }));
  const rev = state.revenda.map(p => ({ ...p, tipo: 'rev', calc: calcRevenda(p) }));
  return [...fab, ...rev];
}

/* ---------------- helpers de formatação ---------------- */
const fmtR = n => 'R$ ' + (Number(n) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtPct = n => ((Number(n) || 0) * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- render raiz ---------------- */
const titles = {
  dashboard: ['Painel', 'Sua margem, sob controle.'],
  custos: ['Custos e Taxas', 'Despesas fixas e impostos do negócio.'],
  insumos: ['Insumos', 'Seus ingredientes e o custo de cada um.'],
  producao: ['Produção Própria', 'Ficha técnica e preço ideal de cada produto.'],
  revenda: ['Revenda', 'Precifique o que você compra pronto.'],
};

function setTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  const [t, s] = titles[tab];
  document.getElementById('screen-title').textContent = t;
  document.getElementById('screen-sub').textContent = s;
  document.getElementById('fab').style.display = (tab === 'dashboard') ? 'none' : 'flex';
  render();
}

function render() {
  const main = document.getElementById('main');
  if (activeTab === 'dashboard') main.innerHTML = renderDashboard();
  if (activeTab === 'custos') main.innerHTML = renderCustos();
  if (activeTab === 'insumos') main.innerHTML = renderInsumos();
  if (activeTab === 'producao') main.innerHTML = renderProducao();
  if (activeTab === 'revenda') main.innerHTML = renderRevenda();
  attachListEvents();
}

/* ---------------- Dashboard ---------------- */
function renderDashboard() {
  const prods = allProducts();
  const n = prods.length;
  const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
  const precoMedio = avg(prods.map(p => Number(p.precoAtual || 0)));
  const margemMedia = avg(prods.map(p => p.calc.margemContrib));
  const lucroMedio = avg(prods.map(p => p.calc.lucroUnit));
  const pe = margemMedia > 0 ? totalFixo() / margemMedia : 0;

  const kpis = [
    ['Produtos cadastrados', n, false],
    ['Preço médio de venda', fmtR(precoMedio), true],
    ['Custos fixos / mês', fmtR(totalFixo()), true],
    ['Margem de contribuição média', fmtR(margemMedia), true],
    ['Ponto de equilíbrio (un./mês)', pe > 0 ? Math.ceil(pe).toLocaleString('pt-BR') : '—', false],
    ['Lucro médio por unidade', fmtR(lucroMedio), true],
  ];

  const byLucro = [...prods].sort((a, b) => b.calc.lucroUnit - a.calc.lucroUnit).slice(0, 5);
  const byCusto = [...prods].sort((a, b) => b.calc.custoTotal - a.calc.custoTotal).slice(0, 5);

  if (n === 0) {
    return `
      <div class="empty">
        <p class="display">Ainda sem produtos</p>
        <p>Cadastre seus insumos e depois um produto em "Produção" ou "Revenda" para o painel ganhar vida.</p>
      </div>`;
  }

  return `
    <p class="section-title">Visão geral</p>
    <div class="kpi-grid">
      ${kpis.map(([label, val, mono]) => `
        <div class="kpi">
          <div class="label">${label}</div>
          <div class="value ${String(val).length > 8 ? 'small' : ''} ${mono ? 'num' : ''}">${val}</div>
        </div>`).join('')}
    </div>

    <p class="section-title">Top 5 mais lucrativos</p>
    <div class="card">${renderRankList(byLucro, p => p.calc.lucroUnit, 'var(--success)')}</div>

    <p class="section-title">Top 5 maior custo</p>
    <div class="card">${renderRankList(byCusto, p => p.calc.custoTotal, 'var(--gold)')}</div>
  `;
}
function renderRankList(list, valueFn, color) {
  if (!list.length) return `<p class="helper-note">Sem dados ainda.</p>`;
  const max = Math.max(...list.map(valueFn), 0.01);
  return list.map((p, i) => `
    <div class="rank-row">
      <div class="rank-idx">${i + 1}</div>
      <div class="rank-name">${esc(p.nome)}</div>
      <div class="rank-bar-wrap"><div class="rank-bar" style="width:${Math.max(6, valueFn(p) / max * 100)}%; background:${color}"></div></div>
      <div class="rank-val">${fmtR(valueFn(p))}</div>
    </div>`).join('');
}

/* ---------------- Produção ---------------- */
function renderProducao() {
  const catBar = `
    <div class="row-between" style="margin:2px 0 14px;">
      <p class="section-title" style="margin:0">Suas fichas técnicas</p>
      <button class="cat-manage-btn" id="btn-manage-cat">🗂 Categorias</button>
    </div>`;
  if (!state.fabricacao.length) return catBar + emptyState('Nenhum produto de fabricação', 'Toque no + para montar a primeira ficha técnica.');

  const cats = state.categoriasProducao;
  if (!cats.length) {
    // sem categorias criadas: lista simples, mas já com reorder (todos no mesmo grupo "null")
    return catBar + state.fabricacao.map(p => productCard(p, calcFabricacao(p), 'fab')).join('');
  }

  const groups = [...cats.map(c => ({ id: c.id, nome: c.nome })), { id: null, nome: 'Sem categoria' }];
  let html = catBar;
  groups.forEach(g => {
    const items = state.fabricacao.filter(p => (p.categoriaId || null) === g.id);
    if (!items.length) return;
    html += `<p class="cat-heading">${esc(g.nome)}</p>`;
    html += items.map(p => productCard(p, calcFabricacao(p), 'fab')).join('');
  });
  return html;
}
function renderRevenda() {
  if (!state.revenda.length) return emptyState('Nenhum produto de revenda', 'Toque no + para precificar um produto comprado pronto.');
  return state.revenda.map(p => productCard(p, calcRevenda(p), 'rev')).join('');
}
function productCard(p, calc, tipo) {
  const metaLine = tipo === 'fab'
    ? `Atual ${fmtR(p.precoAtual)} · Custo ${fmtR(calc.custoTotal)}${calc.rendimento > 1 ? ` (rende ${calc.rendimento})` : ''}`
    : `Atual ${fmtR(p.precoAtual)} · Ideal ${fmtR(calc.precoIdeal)}`;
  let reorder = '';
  if (tipo === 'fab') {
    const siblings = state.fabricacao.filter(x => (x.categoriaId || null) === (p.categoriaId || null));
    const idx = siblings.findIndex(x => x.id === p.id);
    reorder = `
      <div class="reorder-col">
        <button class="reorder-btn btn-move" data-dir="up" data-id="${p.id}" ${idx <= 0 ? 'disabled' : ''} aria-label="Mover para cima">▲</button>
        <button class="reorder-btn btn-move" data-dir="down" data-id="${p.id}" ${idx >= siblings.length - 1 ? 'disabled' : ''} aria-label="Mover para baixo">▼</button>
      </div>`;
  }
  return `
    <div class="item" data-kind="${tipo}" data-id="${p.id}" style="align-items:flex-start; flex-direction:column; gap:8px;">
      <div class="row-between" style="width:100%">
        <div style="display:flex; gap:10px; align-items:center; min-width:0; flex:1;">
          ${reorder}
          <div class="info">
            <div class="name">${esc(p.nome)}</div>
            <div class="meta">${metaLine}</div>
          </div>
        </div>
        <div style="display:flex; gap:6px; flex-shrink:0;">
          <button class="icon-btn btn-dup" data-kind="${tipo}" data-id="${p.id}" aria-label="Duplicar">${dupIcon()}</button>
          <button class="icon-btn btn-del" data-kind="${tipo}" data-id="${p.id}" aria-label="Excluir">${trashIcon()}</button>
        </div>
      </div>
      <div class="row-between" style="width:100%">
        <span class="stamp ${calc.status}">${calc.status === 'ok' ? 'Dentro da margem' : 'Ajustar preço'}</span>
        <span class="price">${tipo === 'fab' ? 'Lucro ' : ''}${calc.resultado >= 0 ? '▲ ' : '▼ '}${fmtR(Math.abs(calc.resultado))}</span>
      </div>
    </div>`;
}
function emptyState(title, sub) {
  return `<div class="empty"><p class="display">${title}</p><p>${sub}</p></div>`;
}
function emptyRow(msg) { return `<p class="helper-note">${msg}</p>`; }
function trashIcon() {
  return `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m2 0-1 13a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 7"/></svg>`;
}
function dupIcon() {
  return `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>`;
}

/* ---------------- eventos de lista ---------------- */
function attachListEvents() {
  document.querySelectorAll('.btn-del').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const { kind, id } = btn.dataset;
      confirmDelete(kind, id);
    });
  });
  document.querySelectorAll('.btn-dup').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const { kind, id } = btn.dataset;
      duplicateProduto(kind, id);
    });
  });
  document.querySelectorAll('.btn-move').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      moveProduto(btn.dataset.id, btn.dataset.dir);
    });
  });
  const btnManageCat = document.getElementById('btn-manage-cat');
  if (btnManageCat) btnManageCat.addEventListener('click', openCategoriasSheet);
  document.querySelectorAll('.item[data-kind]').forEach(el => {
    el.addEventListener('click', () => {
      const { kind, id } = el.dataset;
      if (kind === 'custo') openCustoSheet('fixo', id);
      if (kind === 'taxa') openCustoSheet('taxa', id);
      if (kind === 'insumo') openInsumoSheet(id);
      if (kind === 'fab') openProdutoSheet('fab', id);
      if (kind === 'rev') openProdutoSheet('rev', id);
    });
  });
  const inpProd = document.getElementById('inp-producao');
  if (inpProd) inpProd.addEventListener('input', e => { state.producaoMensal = Number(e.target.value || 0); saveState(); render(); });
}
function duplicateProduto(kind, id) {
  const list = kind === 'fab' ? state.fabricacao : state.revenda;
  const original = list.find(x => x.id === id);
  if (!original) return;
  const copy = structuredClone(original);
  copy.id = uid();
  copy.nome = original.nome + ' (cópia)';
  if (kind === 'fab') {
    copy.ingredientes = (copy.ingredientes || []).map(ing => ({ ...ing }));
    copy.adicionais = (copy.adicionais || []).map(ad => ({ ...ad }));
  }
  list.push(copy);
  saveState(); render();
  openProdutoSheet(kind, copy.id);
}
function moveProduto(id, direction) {
  const list = state.fabricacao;
  const item = list.find(p => p.id === id);
  if (!item) return;
  const cat = item.categoriaId || null;
  const siblings = list.filter(p => (p.categoriaId || null) === cat);
  const idx = siblings.findIndex(p => p.id === id);
  const swapIdx = direction === 'up' ? idx - 1 : idx + 1;
  if (swapIdx < 0 || swapIdx >= siblings.length) return;
  const other = siblings[swapIdx];
  const realIdxA = list.indexOf(item);
  const realIdxB = list.indexOf(other);
  [list[realIdxA], list[realIdxB]] = [list[realIdxB], list[realIdxA]];
  saveState(); render();
}

/* ---------------- Categorias de produção ---------------- */
function openCategoriasSheet() {
  function listHtml() {
    if (!state.categoriasProducao.length) return `<p class="helper-note">Nenhuma categoria criada ainda.</p>`;
    return state.categoriasProducao.map((c, idx) => `
      <div class="cat-row" data-id="${c.id}">
        <div class="reorder-col">
          <button class="reorder-btn cat-move" data-dir="up" data-id="${c.id}" ${idx === 0 ? 'disabled' : ''}>▲</button>
          <button class="reorder-btn cat-move" data-dir="down" data-id="${c.id}" ${idx === state.categoriasProducao.length - 1 ? 'disabled' : ''}>▼</button>
        </div>
        <div class="cat-name">${esc(c.nome)}</div>
        <button class="icon-btn cat-rename" data-id="${c.id}" aria-label="Renomear">✏️</button>
        <button class="icon-btn cat-del" data-id="${c.id}" aria-label="Excluir">${trashIcon()}</button>
      </div>`).join('');
  }
  function refresh() {
    document.getElementById('cat-list').innerHTML = listHtml();
    wireRows();
  }
  function wireRows() {
    document.querySelectorAll('.cat-move').forEach(btn => {
      btn.onclick = () => {
        const cats = state.categoriasProducao;
        const idx = cats.findIndex(c => c.id === btn.dataset.id);
        const swap = btn.dataset.dir === 'up' ? idx - 1 : idx + 1;
        if (swap < 0 || swap >= cats.length) return;
        [cats[idx], cats[swap]] = [cats[swap], cats[idx]];
        saveState(); refresh();
      };
    });
    document.querySelectorAll('.cat-rename').forEach(btn => {
      btn.onclick = () => {
        const c = state.categoriasProducao.find(x => x.id === btn.dataset.id);
        const novo = prompt('Novo nome da categoria:', c.nome);
        if (novo && novo.trim()) { c.nome = novo.trim(); saveState(); refresh(); }
      };
    });
    document.querySelectorAll('.cat-del').forEach(btn => {
      btn.onclick = () => {
        if (!confirm('Excluir esta categoria? As produções dela voltam para "Sem categoria".')) return;
        const id = btn.dataset.id;
        state.categoriasProducao = state.categoriasProducao.filter(c => c.id !== id);
        state.fabricacao.forEach(p => { if (p.categoriaId === id) p.categoriaId = null; });
        saveState(); refresh();
      };
    });
  }
  openSheet(`
    <h2>Categorias de Produção</h2>
    <p class="sheet-sub">Organize suas fichas técnicas em grupos, como Cookies, Bolos, Salgados.</p>
    <div id="cat-list">${listHtml()}</div>
    <button class="add-ing-btn" id="btn-add-cat" style="margin-top:12px;">+ nova categoria</button>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn primary" id="btn-close-cat" style="flex:1">Concluído</button>
    </div>
  `);
  wireRows();
  document.getElementById('btn-close-cat').onclick = () => { closeSheet(); render(); };
  document.getElementById('btn-add-cat').onclick = () => {
    const nome = prompt('Nome da nova categoria:');
    if (nome && nome.trim()) {
      state.categoriasProducao.push({ id: uid(), nome: nome.trim() });
      saveState(); refresh();
    }
  };
}
function confirmDelete(kind, id) {
  const map = {
    custo: state.custosFixos, taxa: state.taxas, insumo: state.insumos,
    fab: state.fabricacao, rev: state.revenda,
  };
  const list = map[kind];
  const idx = list.findIndex(x => x.id === id);
  if (idx === -1) return;
  if (!confirm('Excluir este item?')) return;
  list.splice(idx, 1);
  saveState(); render();
}

/* ---------------- Sheet (modal) genérico ---------------- */
const backdrop = document.getElementById('sheet-backdrop');
const sheetEl = document.getElementById('sheet-content');
function openSheet(html) { sheetEl.innerHTML = html; backdrop.classList.add('open'); }
function closeSheet() { backdrop.classList.remove('open'); sheetEl.innerHTML = ''; }
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeSheet(); });

function openCustoSheet(type, id) {
  const isFixo = type === 'fixo';
  const list = isFixo ? state.custosFixos : state.taxas;
  const item = id ? list.find(x => x.id === id) : null;
  openSheet(`
    <h2>${item ? 'Editar' : 'Novo'} ${isFixo ? 'custo fixo' : 'taxa/imposto'}</h2>
    <p class="sheet-sub">${isFixo ? 'Uma despesa fixa mensal do seu negócio.' : 'Um percentual cobrado sobre a venda.'}</p>
    <div class="field"><label>Descrição</label><input id="f-desc" value="${item ? esc(item.desc) : ''}" placeholder="${isFixo ? 'Ex: Aluguel' : 'Ex: Simples Nacional'}"></div>
    <div class="field"><label>${isFixo ? 'Valor mensal (R$)' : 'Percentual (%)'}</label>
      <input id="f-val" type="number" step="0.01" inputmode="decimal" value="${item ? (isFixo ? item.valor : item.pct * 100) : ''}"></div>
    <div class="btn-row">
      <button class="btn ghost" id="btn-cancel">Cancelar</button>
      <button class="btn primary" id="btn-save">Salvar</button>
    </div>
  `);
  document.getElementById('btn-cancel').onclick = closeSheet;
  document.getElementById('btn-save').onclick = () => {
    const desc = document.getElementById('f-desc').value.trim() || (isFixo ? 'Custo fixo' : 'Taxa');
    const raw = Number(document.getElementById('f-val').value || 0);
    if (item) {
      item.desc = desc;
      if (isFixo) item.valor = raw; else item.pct = raw / 100;
    } else {
      list.push(isFixo ? { id: uid(), desc, valor: raw } : { id: uid(), desc, pct: raw / 100 });
    }
    saveState(); closeSheet(); render();
  };
}

function openInsumoSheet(id) {
  const item = id ? state.insumos.find(x => x.id === id) : null;
  openSheet(`
    <h2>${item ? 'Editar' : 'Novo'} insumo</h2>
    <p class="sheet-sub">Preço e quantidade da embalagem que você compra.</p>
    <div class="field"><label>Nome</label><input id="f-nome" value="${item ? esc(item.nome) : ''}" placeholder="Ex: Farinha de trigo"></div>
    <div class="field-row">
      <div class="field"><label>Unidade</label><input id="f-un" value="${item ? esc(item.unidade) : ''}" placeholder="kg, un, ml..."></div>
      <div class="field"><label>Qtd. na embalagem</label><input id="f-qtd" type="number" step="0.001" inputmode="decimal" value="${item ? item.qtdEmbalagem : 1}"></div>
    </div>
    <div class="field"><label>Preço de compra (R$)</label><input id="f-preco" type="number" step="0.01" inputmode="decimal" value="${item ? item.precoCompra : ''}"></div>
    <div class="btn-row">
      <button class="btn ghost" id="btn-cancel">Cancelar</button>
      <button class="btn primary" id="btn-save">Salvar</button>
    </div>
  `);
  document.getElementById('btn-cancel').onclick = closeSheet;
  document.getElementById('btn-save').onclick = () => {
    const nome = document.getElementById('f-nome').value.trim();

    else state.insumos.push({ id: uid(), nome, unidade, qtdEmbalagem, precoCompra });

  };
}

function openProdutoSheet(tipo, id) {
  const isFab = tipo === 'fab';
  const list = isFab ? state.fabricacao : state.revenda;
  const item = id ? list.find(x => x.id === id) : null;
  const draft = item ? structuredClone(item) : (isFab
    ? { id: uid(), nome: '', precoAtual: 0, margem: 0.3, rendimento: 1, ingredientes: [], adicionais: [] }
    : { id: uid(), nome: '', custoCompra: 0, margem: 0.3, precoAtual: 0 });
  if (isFab && !draft.rendimento) draft.rendimento = 1;
  if (isFab && !draft.adicionais) draft.adicionais = [];

  if (isFab && draft.categoriaId === undefined) draft.categoriaId = null;

  function ingredientsHtml() {
    return draft.ingredientes.map((ing, idx) => `
      <div class="ing-row" data-idx="${idx}">
        <select class="ing-select">
          ${state.insumos.map(i => `<option value="${i.id}" ${i.id === ing.insumoId ? 'selected' : ''}>${esc(i.nome)}</option>`).join('')}
        </select>
        <input class="ing-qtd" type="number" step="0.001" inputmode="decimal" value="${ing.qtd}" placeholder="Qtd">
        <button class="ing-remove" data-idx="${idx}">×</button>
      </div>`).join('');
  }

  function adicionaisHtml() {
    return draft.adicionais.map((ad, idx) => `
      <div class="ing-row" data-idx="${idx}">
        <select class="ad-select">
          ${state.insumos.map(i => `<option value="${i.id}" ${i.id === ad.insumoId ? 'selected' : ''}>${esc(i.nome)}</option>`).join('')}
        </select>
        <input class="ad-qtd" type="number" step="0.001" inputmode="decimal" value="${ad.qtd}" placeholder="Qtd/un.">
        <button class="ad-remove" data-idx="${idx}">×</button>
      </div>`).join('');
  }

  function summaryHtml() {
    if (!state.insumos.length && isFab) return `<p class="helper-note">Cadastre insumos primeiro para montar a ficha técnica.</p>`;
    const calc = isFab ? calcFabricacao(draft) : calcRevenda(draft);
    const rows = isFab ? [
      ['Custo de insumos (receita toda)', fmtR(calc.subtotalReceita)],
      [`Rendimento: ${calc.rendimento} unidade${calc.rendimento > 1 ? 's' : ''}`, `÷ ${calc.rendimento}`],
      ['Custo da receita por unidade', fmtR(calc.custoBase)],
      ...(draft.adicionais.length ? [['Adicionais por unidade', '+ ' + fmtR(calc.custoAdicionais)]] : []),
      ['Rateio de custos fixos (por un.)', fmtR(calc.rateio)],
      ['Custo total de produção (por un.)', fmtR(calc.custoTotal)],
    ] : [
      ['Rateio de custos fixos', fmtR(calc.rateio ?? rateio())],
      ['Custo total', fmtR(calc.custoTotal)],
    ];
    const resultLabel = isFab ? 'Resultado (atual vs. custo total)' : 'Resultado (atual vs. ideal)';
    return `
      <div class="live-summary">
        ${rows.map(([l, v]) => `<div class="lrow"><span>${l}</span><span>${v}</span></div>`).join('')}
        <div class="lrow total"><span>Preço ideal de venda</span><span>${fmtR(calc.precoIdeal)}</span></div>
        <div class="lrow"><span>${resultLabel}</span>
          <span style="color:${calc.resultado >= 0 ? 'var(--success)' : 'var(--danger)'}">${calc.resultado >= 0 ? '▲' : '▼'} ${fmtR(Math.abs(calc.resultado))}</span></div>
      </div>
      <div style="text-align:center; margin-bottom:14px;">
        <span class="stamp ${calc.status}">${calc.status === 'ok' ? 'Dentro da margem' : 'Ajustar preço'}</span>
      </div>`;
  }

  function fullHtml() {
    return `
      <h2>${item ? 'Editar' : 'Novo'} produto</h2>
      <p class="sheet-sub">${isFab ? 'Monte a ficha técnica e veja o preço ideal na hora.' : 'Informe o custo de compra e a margem desejada.'}</p>
      <div class="field"><label>Nome do produto</label><input id="f-nome" value="${esc(draft.nome)}" placeholder="Ex: Cookie Bar Tradicional"></div>

      ${isFab ? `
        <div class="field"><label>Categoria</label>
          <select id="f-categoria">
            <option value="">Sem categoria</option>
            ${state.categoriasProducao.map(c => `<option value="${c.id}" ${c.id === draft.categoriaId ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}
          </select>
        </div>
        <p class="section-title" style="margin-top:6px">Ingredientes (quantidades da receita inteira)</p>
        <div id="ing-list">${ingredientsHtml()}</div>
        <button class="add-ing-btn" id="btn-add-ing">+ adicionar insumo</button>
        <div class="field"><label>Rendimento da receita (quantas unidades essa forma rende?)</label>
          <input id="f-rendimento" type="number" step="1" min="1" inputmode="numeric" value="${draft.rendimento}" placeholder="Ex: 12 fatias"></div>

        <p class="section-title">Adicionais por unidade (aplicado em cada fatia, não na forma toda)</p>
        <div id="ad-list">${adicionaisHtml()}</div>
        <button class="add-ing-btn" id="btn-add-ad">+ adicionar adicional</button>
      ` : `
        <div class="field"><label>Custo de compra (R$)</label><input id="f-custo" type="number" step="0.01" inputmode="decimal" value="${draft.custoCompra}"></div>
      `}

      <div class="field-row">
        <div class="field"><label>Margem desejada (%)</label><input id="f-margem" type="number" step="1" inputmode="decimal" value="${draft.margem * 100}"></div>
        <div class="field"><label>Preço de venda atual (R$)</label><input id="f-preco" type="number" step="0.01" inputmode="decimal" value="${draft.precoAtual}"></div>
      </div>

      <div id="summary-slot">${summaryHtml()}</div>

      <div class="btn-row">
        <button class="btn ghost" id="btn-cancel">Cancelar</button>
        <button class="btn primary" id="btn-save">Salvar</button>
      </div>
    `;
  }

  function wireEvents() {
    document.getElementById('btn-cancel').onclick = closeSheet;
    document.getElementById('f-nome').oninput = e => draft.nome = e.target.value;
    document.getElementById('f-margem').oninput = e => { draft.margem = Number(e.target.value || 0) / 100; refreshSummary(); };
    document.getElementById('f-preco').oninput = e => { draft.precoAtual = Number(e.target.value || 0); refreshSummary(); };
    if (isFab) {
      document.getElementById('btn-add-ing').onclick = () => {
        if (!state.insumos.length) { alert('Cadastre um insumo primeiro, na aba Insumos.'); return; }
        draft.ingredientes.push({ insumoId: state.insumos[0].id, qtd: 0 });
        rerenderIngredients();
      };
      document.getElementById('btn-add-ad').onclick = () => {
        if (!state.insumos.length) { alert('Cadastre um insumo primeiro, na aba Insumos.'); return; }
        draft.adicionais.push({ insumoId: state.insumos[0].id, qtd: 0 });
        rerenderAdicionais();
      };
      document.getElementById('f-rendimento').oninput = e => { draft.rendimento = Math.max(1, Number(e.target.value || 1)); refreshSummary(); };
      document.getElementById('f-categoria').onchange = e => { draft.categoriaId = e.target.value || null; };
      wireIngredientRows();
      wireAdicionalRows();
    } else {
      document.getElementById('f-custo').oninput = e => { draft.custoCompra = Number(e.target.value || 0); refreshSummary(); };
    }
    document.getElementById('btn-save').onclick = () => {
      if (!draft.nome.trim()) { alert('Dê um nome ao produto.'); return; }
      if (item) Object.assign(item, draft); else list.push(draft);
      saveState(); closeSheet(); render();
    };
  }
  function wireIngredientRows() {
    document.querySelectorAll('.ing-select').forEach((sel, idx) => {
      sel.onchange = e => { draft.ingredientes[idx].insumoId = e.target.value; refreshSummary(); };
    });
    document.querySelectorAll('.ing-qtd').forEach((inp, idx) => {
      inp.oninput = e => { draft.ingredientes[idx].qtd = Number(e.target.value || 0); refreshSummary(); };
    });
    document.querySelectorAll('.ing-remove').forEach(btn => {
      btn.onclick = () => { draft.ingredientes.splice(Number(btn.dataset.idx), 1); rerenderIngredients(); };
    });
  }
  function rerenderIngredients() {
    document.getElementById('ing-list').innerHTML = ingredientsHtml();
    wireIngredientRows();
    refreshSummary();
  }
  function wireAdicionalRows() {
    document.querySelectorAll('.ad-select').forEach((sel, idx) => {
      sel.onchange = e => { draft.adicionais[idx].insumoId = e.target.value; refreshSummary(); };
    });
    document.querySelectorAll('.ad-qtd').forEach((inp, idx) => {
      inp.oninput = e => { draft.adicionais[idx].qtd = Number(e.target.value || 0); refreshSummary(); };
    });
    document.querySelectorAll('.ad-remove').forEach(btn => {
      btn.onclick = () => { draft.adicionais.splice(Number(btn.dataset.idx), 1); rerenderAdicionais(); };
    });
  }
  function rerenderAdicionais() {
    document.getElementById('ad-list').innerHTML = adicionaisHtml();
    wireAdicionalRows();
    refreshSummary();
  }
  function refreshSummary() {
    document.getElementById('summary-slot').innerHTML = summaryHtml();
  }

  openSheet(fullHtml());
  wireEvents();
}

/* ---------------- boot ---------------- */
document.querySelectorAll('.tabbar button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
document.getElementById('fab').addEventListener('click', () => {
  if (activeTab === 'custos') openCustoSheet('fixo', null);
  if (activeTab === 'insumos') openInsumoSheet(null);
  if (activeTab === 'producao') openProdutoSheet('fab', null);
  if (activeTab === 'revenda') openProdutoSheet('rev', null);
});
document.getElementById('btn-settings').addEventListener('click', openSettingsSheet);

function openSettingsSheet() {
  openSheet(`
    <h2>Backup dos dados</h2>
    <p class="sheet-sub">Tudo fica salvo só neste aparelho e neste navegador. Exporte de vez em quando para não perder nada se trocar de celular ou limpar o navegador.</p>
    <div class="btn-row" style="margin-bottom:10px">
      <button class="btn primary" id="btn-export">Exportar backup (.json)</button>
    </div>
    <div class="field">
      <label>Importar backup</label>
      <input type="file" id="f-import" accept="application/json">
    </div>
    <p class="helper-note" id="import-msg"></p>
    <div class="btn-row">
      <button class="btn ghost" id="btn-close-settings">Fechar</button>
    </div>
  `);
  document.getElementById('btn-close-settings').onclick = closeSheet;
  document.getElementById('btn-export').onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url; a.download = `precificacao-backup-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };
  document.getElementById('f-import').onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (!imported || typeof imported !== 'object') throw new Error('formato inválido');
        state = { ...structuredClone(DEFAULT_STATE), ...imported };
        saveState();
        document.getElementById('import-msg').textContent = 'Backup importado com sucesso.';
        render();
      } catch (err) {
        document.getElementById('import-msg').textContent = 'Não foi possível ler este arquivo.';
      }
    };
    reader.readAsText(file);
  };
}

/* ---------------- PWA: ícone + manifest + service worker inline ---------------- */
(function setupPWA() {
  const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="22" fill="#1F4E3D"/>
    <text x="50" y="66" font-family="Georgia,serif" font-size="52" font-weight="700" fill="#F2E4C1" text-anchor="middle">$</text>
  </svg>`;
  const iconUrl = 'data:image/svg+xml;base64,' + btoa(svgIcon);
  document.getElementById('apple-icon').setAttribute('href', iconUrl);
  document.getElementById('favicon').setAttribute('href', iconUrl);

  const manifest = {
    name: 'Precificação Lucrativa',
    short_name: 'Precificação',
    start_url: '.',
    display: 'standalone',
    background_color: '#FAF7F0',
    theme_color: '#1F4E3D',
    icons: [
      { src: iconUrl, sizes: '192x192', type: 'image/svg+xml', purpose: 'any' },
      { src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' },
    ],
  };
  const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  document.getElementById('manifest-link').setAttribute('href', URL.createObjectURL(manifestBlob));

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    const swCode = `
      const CACHE = 'precificacao-v1';
      self.addEventListener('install', e => { self.skipWaiting(); });
      self.addEventListener('activate', e => { self.clients.claim(); });
      self.addEventListener('fetch', e => {
        if (e.request.method !== 'GET') return;
        e.respondWith(
          caches.open(CACHE).then(cache =>
            cache.match(e.request).then(cached => {
              const fetchPromise = fetch(e.request).then(res => {
                if (res && res.status === 200) cache.put(e.request, res.clone());
                return res;
              }).catch(() => cached);
              return cached || fetchPromise;
            })
          )
        );
      });
    `;
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
  }
})();

setTab('dashboard');
</script>
